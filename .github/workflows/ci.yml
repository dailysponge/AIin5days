name: LogiRoute CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    name: Test, Lint, IaC Validation & Quality Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Code Syntax and Imports
        run: |
          python -m py_compile logiroute/*.py logiroute/*/*.py main.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Validate Terraform IaC Configuration
        run: |
          cd terraform
          terraform init -backend=false
          terraform validate

      - name: Run Test Suite & Automated Evaluation
        env:
          PORT: 8080
          LOG_LEVEL: INFO
        run: |
          pytest -v --tb=short

      - name: Build Docker Container
        run: |
          docker build -t logiroute-agent:ci .
