apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: logiroute-agent
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/description: "LogiRoute - Autonomous Logistics Dispatch Agent using Google Cloud ADK"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/logiroute-agent:latest
          resources:
            limits:
              cpu: "1000m"
              memory: "512Mi"
          env:
            - name: MODEL_NAME
              value: "gemini-2.5-flash"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PORT
              value: "8080"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  key: latest
                  name: gemini-api-key
          ports:
            - name: http1
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
